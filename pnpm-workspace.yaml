packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  "@types/node": ^26.6.4
# Supply chain: a version must be 3 days old before it can be installed
# (most malicious releases are yanked within hours).
minimumReleaseAge: 4320
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
